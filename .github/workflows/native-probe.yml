name: Azure Core native Windows ARM64
on:
  push:
    branches: [codex/azure-core-wil-cpp14-probe]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'ClayWarren/azure-core-cpp-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        config: [win_arm64_]
        version: ["1.16.3", "1.16.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select exact Azure Core source
        shell: pwsh
        env:
          CORE_VERSION: ${{ matrix.version }}
        run: |
          if ($env:CORE_VERSION -eq '1.16.4') {
            $path = 'recipe/meta.yaml'
            $recipe = (Get-Content $path -Raw).Replace('1.16.3', '1.16.4').Replace('70d5d2aea5ece95148ee8b71fb302ae35a1178e58b58150a14df8866a0c54464', '25f8badf23c66ae82debd95e0d074d6269b276e5fa2ce5d4d3cff38fda9ab8c2')
            Set-Content -Path $path -Value $recipe
          }
      - name: Retrieve verified patched noarch WIL prerequisite
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path C:/azure-core-prereqs/noarch -Force | Out-Null
          gh run download 34731761426 --repo ClayWarren/wil-feedstock --name wil-noarch-package --dir "$env:RUNNER_TEMP/wil"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $pkg = @(Get-ChildItem "$env:RUNNER_TEMP/wil" -Recurse -Filter 'wil-1.0.260126.7-h01c409f_2.conda')
          if ($pkg.Count -ne 1) { throw 'Expected one exact prerequisite' }
          if ((Get-FileHash $pkg[0].FullName -Algorithm SHA256).Hash.ToLower() -ne '2ab5926d894643643a4a1c3c8708652c371ee8b24949ea0a90fac7f3461980f1') { throw 'Prerequisite checksum mismatch' }
          Copy-Item $pkg[0].FullName C:/azure-core-prereqs/noarch/
      - name: Build and test Azure Core
        shell: cmd
        env:
          BUILD_PLATFORM: win-arm64
          CI: github_actions
          CONDA_BLD_PATH: C:\bld
          CONFIG: ${{ matrix.config }}
          MINIFORGE_HOME: C:\Miniforge
          PYTHONUNBUFFERED: '1'
          UPLOAD_PACKAGES: 'False'
          CONDA_CHANNEL_PRIORITY: strict
          EXTRA_CB_OPTIONS: '--override-channels -c file:///C:/azure-core-prereqs -c conda-forge'
          RATTLER_BUILD_COLOR: always
          RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: 'true'
        run: |
          set "flow_run_id=github_%GITHUB_RUN_ID%"
          set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
          set "sha=%GITHUB_SHA%"
          call ".scripts\run_win_build.bat"
      - name: Preserve Azure Core package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: azure-core-${{ matrix.version }}-wil-cpp14-package
          path: C:\bld\**\*.conda
          if-no-files-found: warn
          retention-days: 90
